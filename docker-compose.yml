# Только база данных. Приложение и имитатор запускаются локально (см. README).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: renewals
      POSTGRES_PASSWORD: renewals
      POSTGRES_DB: renewals
    ports:
      # 5433 снаружи, чтобы не конфликтовать с локальным PostgreSQL на 5432
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # создаёт вторую базу renewals_test для автотестов
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U renewals -d renewals"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
